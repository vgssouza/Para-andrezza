<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Andrezza ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --ink:#1c1a18; --muted:#8a837a; --accent:#c2574a; --line:#e6dfd5;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  img{display:block;width:100%;height:100%;object-fit:cover}

  /* progress line */
  #progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:50;transition:width .1s linear}

  /* HERO */
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative}
  .eyebrow{font-size:.72rem;letter-spacing:.38em;text-transform:uppercase;color:var(--muted)}
  .hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(4rem,16vw,11rem);line-height:.95;margin:1.4rem 0 1rem;letter-spacing:-.02em}
  .hero h1 em{font-style:italic;color:var(--accent)}
  .hero p{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,2.4vw,1.45rem);color:var(--muted)}
  .scroll{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.7rem;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .scroll span{width:1px;height:46px;background:linear-gradient(var(--muted),transparent);animation:drop 2s ease-in-out infinite}
  @keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* INTRO */
  .intro{max-width:720px;margin:0 auto;padding:12vh 2rem;text-align:center}
  .intro p{font-family:var(--serif);font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.45;font-weight:300}
  .intro p + p{margin-top:1.6rem}
  .divider{width:40px;height:1px;background:var(--accent);margin:0 auto 3rem}

  /* MOMENTS */
  .moment{display:grid;grid-template-columns:1fr 1fr;gap:6vw;align-items:center;max-width:1100px;margin:0 auto;padding:10vh 2rem}
  .moment.rev .photo{order:2}
  .photo{aspect-ratio:3/4;overflow:hidden;border-radius:2px;background:var(--line)}
  .photo img{transition:transform 1.6s cubic-bezier(.2,.7,.2,1);transform:scale(1.08)}
  .moment.in .photo img{transform:scale(1)}
  .text .num{font-size:.7rem;letter-spacing:.35em;color:var(--accent)}
  .text h2{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,4.4vw,3.3rem);line-height:1.1;margin:1rem 0 1.2rem}
  .text h2 em{font-style:italic}
  .text p{font-size:1rem;line-height:1.85;color:#5a544d;max-width:380px}

  /* WIDE */
  .wide{position:relative;height:100vh;overflow:hidden;margin:8vh 0}
  .wide img{position:absolute;inset:0;transform:scale(1.15)}
  .wide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
  .wide .caption{position:absolute;left:0;right:0;bottom:12vh;text-align:center;color:#fff;z-index:2;padding:0 2rem}
  .wide .caption h2{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,5.5vw,4.2rem);line-height:1.15}
  .wide .caption h2 em{font-style:italic}

  /* PAIR */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;max-width:900px;margin:0 auto;padding:8vh 2rem}
  .pair .photo:last-child{margin-top:18%}
  .pair-text{text-align:center;padding:0 2rem 6vh;max-width:640px;margin:0 auto}
  .pair-text p{font-family:var(--serif);font-style:italic;font-size:clamp(1.4rem,3vw,2rem);line-height:1.4}

  /* FINAL */
  .final{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 2rem;position:relative}
  .final .letter{max-width:600px;font-family:var(--serif);font-size:clamp(1.25rem,2.6vw,1.6rem);line-height:1.7;color:#3b3631}
  .final .letter p + p{margin-top:1.3rem}
  .final h2{font-family:var(--serif);font-weight:300;font-size:clamp(3rem,10vw,7rem);line-height:1;margin:4rem 0 1rem}
  .final h2 em{font-style:italic;color:var(--accent)}
  .sign{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--muted);margin-top:1rem}
  .heart-btn{margin-top:3.5rem;background:none;border:1px solid var(--line);width:72px;height:72px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:all .4s ease}
  .heart-btn:hover{border-color:var(--accent);transform:scale(1.06)}
  .heart-btn svg{width:26px;height:26px;fill:var(--accent);animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
  .hint{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:1rem}
  footer{text-align:center;padding:3rem 2rem;font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}

  .float-heart{position:fixed;pointer-events:none;z-index:60;color:var(--accent);font-size:20px;animation:rise 3.2s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-75vh) translateX(var(--dx)) scale(1.2) rotate(var(--rot))}}

  /* reveal */
  .reveal{opacity:0;transform:translateY(40px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .d1{transition-delay:.15s}.d2{transition-delay:.3s}.d3{transition-delay:.45s}

  @media (max-width:760px){
    .moment{grid-template-columns:1fr;gap:2.2rem;padding:8vh 1.5rem}
    .moment.rev .photo{order:0}
    .text p{max-width:none}
    .wide{height:70vh}
  }
</style>
</head>
<body>
<div id="progress"></div>

<section class="hero">
  <div class="eyebrow reveal">Victor &amp; Andrezza</div>
  <h1 class="reveal d1">Para <em>você</em></h1>
  <p class="reveal d2">uma pequena declaração de um coração que é todo seu</p>
  <div class="scroll"><span></span>role</div>
</section>

<section class="intro">
  <div class="divider reveal"></div>
  <p class="reveal">Andrezza, eu poderia escrever mil linhas e ainda assim não caberia tudo o que sinto por você.</p>
  <p class="reveal d1">Então resolvi guardar aqui alguns dos nossos momentos — porque é neles que o amor mora.</p>
</section>
